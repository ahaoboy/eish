name: Release

permissions:
  contents: write

on: [push]

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            RUSTFLAGS: -C target-feature=+crt-static
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          # - target: arm64ec-pc-windows-msvc
          #   os: windows-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: run cross-build
        uses: ahaoboy/cross-build@v1
        with:
          bin: eish
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.RUSTFLAGS }}
          tag: nightly
          allowUpdates: true
          features: cli

      - name: Install eish
        run: cargo install --path . --features cli

      - name: Generate and run installers
        run: |
          repos=(
            easy-install/easy-install
            boa-dev/boa
            theMackabu/ant
            ahaoboy/es5
            quickjs-ng/quickjs
          )

          mkdir -p target/verify
          failed=0

          for repo in "${repos[@]}"; do
            name="${repo##*/}"
            script="target/verify/$name.sh"
            dir="$PWD/target/verify/$name"
            mkdir -p "$dir"

            echo "::group::$repo"

            if ! eish "$repo" --shell bash -o "$script"; then
              echo "::error::$repo: could not generate the installer"
              failed=1
              echo "::endgroup::"
              continue
            fi

            if ! bash -n "$script"; then
              echo "::error::$repo: the generated script is not valid bash"
              failed=1
              echo "::endgroup::"
              continue
            fi

            echo "--- platform table ---"
            sed -n '/^platform_filename()/,/^}/p' "$script"

            if ! EI_DIR="$dir" EI_MIN_DISK_SPACE=0 bash "$script"; then
              echo "::error::$repo: the installer failed"
              failed=1
              echo "::endgroup::"
              continue
            fi

            echo "--- installed ---"
            ls -l "$dir"

            # An empty directory means the installer exited cleanly without
            # producing a binary, which is the failure mode this job exists to
            # catch.
            installed="$(find "$dir" -maxdepth 1 -type f -perm -u+x | head -n 1)"
            if [ -z "$installed" ]; then
              echo "::error::$repo: the installer produced no executable"
              failed=1
              echo "::endgroup::"
              continue
            fi

            echo "installed $installed"
            echo "::endgroup::"
          done

          exit "$failed"
